[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "mpc-demo"
version = "0.1.0"
description = "Demo notebooks for model predictive control (MPC)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cvxpy>=1.8.2",
    "marimo>=0.18.4",
    "numpy>=2.4.4",
    "plotly>=6.7.0",
    "poethepoet>=0.38.0",
    "polars>=1.40.0",
]
[tool.poe.tasks]
edit = "marimo edit notebooks"
run = "server.py"
deploy = "scripts/deploy.sh"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
